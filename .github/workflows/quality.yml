name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Run the shared local and CI quality gate
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run --locked --extra dev bash scripts/dev/check_quality.sh
