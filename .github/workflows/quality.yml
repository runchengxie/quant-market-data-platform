name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Run the shared local and CI quality gate
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run --locked --extra dev bash scripts/dev/check_quality.sh
