site_name: quant-market-data-platform
site_description: Public market data control plane for ingestion, quality, publication, and research access
site_url: https://runchengxie.github.io/quant-market-data-platform/
repo_name: runchengxie/quant-market-data-platform
repo_url: https://github.com/runchengxie/quant-market-data-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-line
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

exclude_docs: |
  README.md
  migration/legacy-materials/

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Architecture and boundaries:
      - Platform overview: architecture/quant-repo-boundaries.md
      - Data lifecycle: data-lifecycle-architecture.md
      - Data ownership migration: ownership-migration.md
      - Integration boundaries: integrations.md
  - Data contracts:
      - Contract overview: contracts.md
      - Data warehouse: data-warehouse.md
      - Research data interface: research-data-interface.md
      - Research integrity: research-integrity.md
  - Sources and operations:
      - Operations overview: operations.md
      - A-share TuShare: operations/a-share-tushare.md
      - A-share minute data: operations/a-share-minutes.md
      - ETF minute data: operations/etf-minutes.md
      - Credentials and configuration: operations/credentials.md
      - Backup and development: operations/backup-and-dev.md
  - Quality and governance:
      - Data governance: data-governance.md
      - L2 ingestion gate: l2-ingestion-gate.md
      - Quality governance: quality-governance.md
      - Testing: operations/testing.md
      - Maintainability audit: maintenance-audit.md
  - Developer reference:
      - Compatibility layer: compatibility.md
      - Publishing and packaging: operations/package-publishing.md
      - Test entry points: testing.md
      - Documentation style: documentation-style.md
      - Research data IO: research-parquet-io.md
      - Quota rendering: quota-rendering.md
      - AFML research features: afml-research-features.md
      - A-share research profile: a-share-research-profile.md
      - A-share fundamentals: a-share-fundamentals.md
      - A-share flow and ownership features: a-share-flow-ownership-features.md
      - Fund top-10 ownership features: a-share-fund-top10-ownership-features.md
      - L2 special-event semantics: l2-special-event-semantics.md
  - 迁移与专题:
      - 历史行业标签: concepts/historical-industry-labels.md
      - 当前资产消费审计: migration/current-assets-consumer-audit.md
      - 当前资产迁移状态: migration/current-assets-migration-status.md
      - 当前资产回滚清单: migration/current-assets-publish-rollback-checklist.md
      - 上下文数据: operations/context-data.md
      - 港股历史恢复: operations/hk-archive-restore.md
