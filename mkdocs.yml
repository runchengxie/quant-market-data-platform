site_name: quant-market-data-platform
site_description: Public market data control plane for ingestion, quality, publication, and research access
site_url: https://runchengxie.github.io/quant-market-data-platform/
repo_name: runchengxie/quant-market-data-platform
repo_url: https://github.com/runchengxie/quant-market-data-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-line
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - project_tools/locale_navigation.py

exclude_docs: |
  README.md
  migration/legacy-materials/

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Architecture and boundaries:
      - Platform overview: architecture/quant-repo-boundaries.en.md
      - Data lifecycle: data-lifecycle-architecture.md
      - Data ownership migration: ownership-migration.en.md
      - Integration boundaries: integrations.en.md
  - Data contracts:
      - Contract overview: contracts.en.md
      - Data warehouse: data-warehouse.en.md
      - Research data interface: research-data-interface.en.md
      - Research integrity: research-integrity.en.md
  - Sources and operations:
      - Operations overview: operations.en.md
      - QuantZone research factors: operations/quantzone.en.md
      - A-share TuShare: operations/a-share-tushare.en.md
      - A-share minute data: operations/a-share-minutes.en.md
      - ETF minute data: operations/etf-minutes.en.md
      - Credentials and configuration: operations/credentials.en.md
      - Backup and development: operations/backup-and-dev.en.md
  - Quality and governance:
      - Data governance: data-governance.en.md
      - L2 ingestion gate: l2-ingestion-gate.en.md
      - Quality governance: quality-governance.en.md
      - Testing: operations/testing.en.md
      - Maintainability audit: maintenance.en.md
  - Developer reference:
      - Compatibility layer: compatibility.en.md
      - Publishing and packaging: operations/package-publishing.en.md
      - Documentation style: documentation-style.en.md
      - Research data IO: research-parquet-io.en.md
      - Quota rendering: quota-rendering.en.md
      - AFML research features: afml-research-features.en.md
      - A-share research profile: a-share-research-profile.en.md
      - A-share fundamentals: a-share-fundamentals.en.md
      - A-share flow and ownership features: a-share-flow-ownership-features.en.md
      - Fund top-10 ownership features: a-share-fund-top10-ownership-features.en.md
      - L2 special-event semantics: l2-special-event-semantics.en.md
  - Migration and topics:
      - Historical industry labels: concepts/historical-industry-labels.en.md
      - Current-asset consumer audit: migration/current-assets-consumer-audit.en.md
      - Current-asset migration status: migration/current-assets-migration-status.en.md
      - Current-asset rollback checklist: migration/current-assets-publish-rollback-checklist.en.md
      - Context data: operations/context-data.en.md
      - Hong Kong archive recovery: operations/hk-archive-restore.en.md
      - Current-assets closeout snapshot: migration/current-assets-closeout-20260918.en.md
  - 简体中文:
