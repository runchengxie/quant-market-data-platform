          - 数据代码生命周期分层: data-lifecycle-architecture.zh-CN.md
          - DailyWatch20 数据归属: ownership-migration.md
          - 系统集成: integrations.md
      - 数据契约:
          - 共享数据契约: contracts.md
          - 数据目录、标准层与 DuckDB 查询: data-warehouse.md
          - 研究数据读取适配器: research-data-interface.md
          - 研究数据完整性边界: research-integrity.md
      - 数据源与运维:
